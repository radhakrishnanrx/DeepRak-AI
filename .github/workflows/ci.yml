name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy --strict)
        run: uv run mypy deeprak

      - name: Smoke import test
        run: |
          uv run python -c "
          import deeprak
          from deeprak.delegate import (
              DelegateRequest, DelegateResponse, LiteLLMAdapter,
              ModelRouter, ModelTier, TaskClassifier, TaskType, TierConfig,
          )
          from deeprak.rag import Chunk, GrepRAG, MarkdownChunker, RAGFilter, RAGMatch
          assert deeprak.__version__
          assert ModelTier.SMALL < ModelTier.STANDARD < ModelTier.PREMIUM
          assert TaskType.recommended_tier(TaskType.PARSING) is ModelTier.SMALL
          assert TaskType.recommended_tier(TaskType.SYNTHESIS) is ModelTier.PREMIUM
          print(f'deeprak v{deeprak.__version__} — public API verified')
          "
