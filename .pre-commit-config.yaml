repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.6
          - types-requests
        args: ["--strict", "--ignore-missing-imports"]
        files: ^deeprak/

  - repo: local
    hooks:
      - id: anonymization-gate
        name: Anonymization Gate (banned-token check)
        entry: bash -c 'BANNED="\b([REDACTED]|[REDACTED]|[REDACTED]|[REDACTED]|[REDACTED]|[REDACTED]|[REDACTED]|[REDACTED]|[REDACTED]|[REDACTED]|[REDACTED])\b"; REPO_NAMES="[REDACTED]|[REDACTED]|[REDACTED]|[REDACTED]"; if grep -rPi --include="*.md" --include="*.py" --include="*.toml" --include="*.yml" --include="*.yaml" --include="*.html" --exclude=".pre-commit-config.yaml" --exclude="anonymization.yml" "$BANNED" .; then echo "Banned token detected (word-boundary)."; exit 1; fi; if grep -rEi --include="*.md" --include="*.py" --include="*.toml" --include="*.yml" --include="*.yaml" --include="*.html" --exclude=".pre-commit-config.yaml" --exclude="anonymization.yml" "($REPO_NAMES)" .; then echo "Internal repo/project name leak."; exit 1; fi; MAX_HITS=$(grep -rP --include="*.md" --include="*.py" --include="*.html" --exclude=".pre-commit-config.yaml" --exclude="anonymization.yml" "\bMax\b" . | grep -v "max_tokens\|maximum\|maxlength\|max length" || true); if [ -n "$MAX_HITS" ]; then echo "Possible Max brand reference: $MAX_HITS"; exit 1; fi; echo "Anonymization gate passed."'
        language: system
        pass_filenames: false
        always_run: true
