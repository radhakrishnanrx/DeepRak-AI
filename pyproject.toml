[project]
name = "deeprak"
version = "0.2.1"
description = "Agentic AI penetration testing runtime: tier-aware model delegation, local security RAG, and skill-based workflow execution for autonomous pentest agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "radhakrishnanrx" },
]
keywords = [
    "ai",
    "agent",
    "agentic",
    "agentic-ai",
    "pentest",
    "penetration-testing",
    "red-team",
    "security",
    "appsec",
    "ai-security",
    "llm-security",
    "orchestration",
    "llm",
    "rag",
    "delegation",
    "workflow",
    "litellm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
]
chatbot = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.urls]
Homepage = "https://github.com/radhakrishnanrx/DeepRak-AI"
Repository = "https://github.com/radhakrishnanrx/DeepRak-AI"
Issues = "https://github.com/radhakrishnanrx/DeepRak-AI/issues"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deeprak"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

# pytest config intentionally omitted — v0.2 ships without an in-repo test
# suite. Forks that add tests can configure pytest themselves.
